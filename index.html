<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:5px;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
}

/* CABEÇALHO */

.header{
    background:#111;
    border:1px solid #f5c400;
    border-radius:10px;
    padding:11px 10px;
    text-align:center;
    margin-bottom:10px;
}

.header h1{
    margin:0;
    color:#f5c400;
    font-size:19px;
}

.header p{
    margin:3px 0 0;
    color:#999;
    font-size:10px;
}

/* CATEGORIA */

.category{
    color:#f5c400;
    font-size:13px;
    font-weight:bold;
    margin:11px 2px 6px;
    padding-bottom:4px;
    border-bottom:1px solid #333;
}

/* PLAYER */

.audio-box{
    background:#111;
    border:1px solid #292929;
    border-radius:8px;
    padding:8px 9px;
    margin-bottom:5px;
}

.audio-title{
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.controls{
    display:flex;
    align-items:center;
    gap:6px;
}

/* BOTÃO */

.play{
    width:30px;
    height:30px;
    min-width:30px;
    border:0;
    border-radius:50%;
    background:#f5c400;
    color:#111;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.play:hover{
    transform:scale(1.06);
}

/* BARRA */

.progress{
    flex:1;
    height:4px;
    accent-color:#f5c400;
    cursor:pointer;
}

/* TEMPO */

.time{
    color:#999;
    font-size:9px;
    min-width:68px;
    text-align:right;
}

/* VOLUME */

.volume{
    width:45px;
    height:4px;
    accent-color:#f5c400;
}

/* CELULAR */

@media(max-width:500px){

    body{
        padding:3px;
    }

    .header h1{
        font-size:17px;
    }

    .header p{
        font-size:9px;
    }

    .audio-title{
        font-size:11px;
    }

    .time{
        min-width:60px;
        font-size:8px;
    }

    .volume{
        width:38px;
    }

}

@media(max-width:360px){

    .volume{
        width:30px;
    }

    .time{
        min-width:55px;
    }

}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>🎙️ SERENATA STUDIO</h1>
    <p>Produção de áudio para rádio, lojas e empresas</p>
</div>

<div id="players"></div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO DO GITHUB
   =========================================================

   COLOQUE AQUI O ENDEREÇO DA PASTA RAW DO SEU GITHUB.

   EXEMPLO:

   https://raw.githubusercontent.com/SEUUSUARIO/SUREPOSITORIO/main/

   IMPORTANTE:
   deixe a barra "/" no final.
========================================================= */

const GITHUB =
"https://raw.githubusercontent.com/SEUUSUARIO/SEUREPOSITORIO/main/";


/* =========================================================
   SEUS 23 ÁUDIOS
========================================================= */

const audios = [

/* ABERTURAS */

{
    categoria:"🎙️ ABERTURAS DE PROGRAMAS",
    titulo:"Abertura de Programa de Rádio 3",
    arquivo:"Abertura%20de%20programa%20de%20r%C3%A1dio%203.mp3"
},

{
    categoria:"🎙️ ABERTURAS DE PROGRAMAS",
    titulo:"Abertura Programa Love Time",
    arquivo:"Abertura%20Programa%20Love%20time.mp3"
},

{
    categoria:"🎙️ ABERTURAS DE PROGRAMAS",
    titulo:"Abertura Programa Show da Noite",
    arquivo:"Abertura%20Programa%20Show%20da%20noite.wav"
},

{
    categoria:"🎙️ ABERTURAS DE PROGRAMAS",
    titulo:"Abertura Programa Show da Tarde",
    arquivo:"Abertura%20Programa%20Show%20da%20tarde.wav"
},


/* SEQUÊNCIA */

{
    categoria:"🎧 SEQUÊNCIA DE PROGRAMA",
    titulo:"Locutora na Sequência de Programa",
    arquivo:"Locutora%20na%20sequ%C3%AAncia%20de%20programa.wav"
},

{
    categoria:"🎧 SEQUÊNCIA DE PROGRAMA",
    titulo:"Locutora na Sequência de Programa 2",
    arquivo:"Locutora%20na%20sequ%C3%AAncia%20de%20programa%202.mp3"
},


/* JINGLES */

{
    categoria:"🎵 JINGLES",
    titulo:"Jingle de Rádio — Exemplo Serenata",
    arquivo:"Jingle%20de%20r%C3%A1dio%20-%20Exemplo%20Serenata.wav"
},

{
    categoria:"🎵 JINGLES",
    titulo:"Jingle Loja de Roupas",
    arquivo:"Jingle%20loja%20de%20roupas.wav"
},


/* LOCUÇÃO INDOOR */

{
    categoria:"🛒 LOCUÇÃO INDOOR",
    titulo:"Locução Indoor Mercado — Açougue",
    arquivo:"locu%C3%A7%C3%A3o%20indoor%20mercado%20-%20a%C3%A7ougue.mp3"
},

{
    categoria:"🛒 LOCUÇÃO INDOOR",
    titulo:"Loja Indoor Roupas — Prezado Cliente",
    arquivo:"loja%20indoor%20roupas%20-%20Prezado%20cliente.wav"
},

{
    categoria:"🛒 LOCUÇÃO INDOOR",
    titulo:"Locução Indoor Mercado — Congelados",
    arquivo:"lou%C3%A7%C3%A3o%20indoor%20mercado%20-%20Congelados.mp3"
},


/* CHAMADAS */

{
    categoria:"📻 CHAMADAS DE RÁDIO",
    titulo:"Chamada de Rádio — Gênero Musical",
    arquivo:"Chamada%20de%20r%C3%A1dio%20-%20G%C3%AAnero%20musical.mp3"
},

{
    categoria:"📻 CHAMADAS DE RÁDIO",
    titulo:"Chamada Institucional",
    arquivo:"Chamada%20Institucional.wav"
},


/* PROGRAMETES */

{
    categoria:"📻 PROGRAMETES",
    titulo:"Dicas para o Inverno",
    arquivo:"Programetes%20-%20Dicas%20para%20o%20inverno.wav"
},

{
    categoria:"📻 PROGRAMETES",
    titulo:"Quadro de Programa — A Música que Marcou",
    arquivo:"Quadro%20de%20programa%20-%20A%20m%C3%BAsica%20que%20marcou.wav"
},


/* SPOTS */

{
    categoria:"📢 SPOTS COMERCIAIS",
    titulo:"Spot Anuncie na Rádio",
    arquivo:"Spot%20Anuncie%20na%20r%C3%A1dio.wav"
},

{
    categoria:"📢 SPOTS COMERCIAIS",
    titulo:"Spot Anuncie na Rádio 2",
    arquivo:"Spot%20anuncie%20na%20r%C3%A1dio%202.wav"
},

{
    categoria:"📢 SPOTS COMERCIAIS",
    titulo:"Spot Comercial para Empresa",
    arquivo:"Spot%20comercial%20para%20empresa.mp3"
},

{
    categoria:"📢 SPOTS COMERCIAIS",
    titulo:"Spot Comercial para Empresa 2",
    arquivo:"Spot%20comercial%20para%20empresa%202.wav"
},


/* VINHETAS */

{
    categoria:"🎚️ VINHETAS",
    titulo:"Sequência de Programa — Vinheta de Passagem",
    arquivo:"Sequ%C3%AAncia%20de%20programa%20-%20Vinheta%20de%20passagem.mp3"
},

{
    categoria:"🎚️ VINHETAS",
    titulo:"Vinheta de Programa de Rádio",
    arquivo:"Vinhet%20de%20programa%20de%20r%C3%A1dio.wav"
},

{
    categoria:"🎚️ VINHETAS",
    titulo:"Vinheta Abertura de Programa 1",
    arquivo:"Vinheta%20abertura%20de%20programa%201.mp3"
},

{
    categoria:"🎚️ VINHETAS",
    titulo:"Vinheta Abertura de Programa 2",
    arquivo:"Vinheta%20abertura%20de%20programa%202.mp3"
}

];


/* =========================================================
   CRIAÇÃO AUTOMÁTICA DOS PLAYERS
========================================================= */

const area = document.getElementById("players");

const players = [];

let categoriaAtual = "";


audios.forEach((item,index)=>{

    /* NOVA CATEGORIA */

    if(item.categoria !== categoriaAtual){

        categoriaAtual = item.categoria;

        const categoria =
            document.createElement("div");

        categoria.className = "category";

        categoria.textContent =
            categoriaAtual;

        area.appendChild(categoria);
    }


    /* PLAYER */

    const box =
        document.createElement("div");

    box.className = "audio-box";


    box.innerHTML = `

        <div class="audio-title">
            ${item.titulo}
        </div>

        <div class="controls">

            <button
                class="play"
                id="play${index}">
                ▶
            </button>

            <input
                class="progress"
                id="progress${index}"
                type="range"
                min="0"
                max="100"
                value="0">

            <span
                class="time"
                id="time${index}">
                00:00 / 00:00
            </span>

            <input
                class="volume"
                id="volume${index}"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1">

        </div>

        <audio
            id="audio${index}"
            src="${GITHUB}${item.arquivo}"
            preload="metadata">
        </audio>
    `;


    area.appendChild(box);


    const audio =
        document.getElementById(
            "audio"+index
        );

    const button =
        document.getElementById(
            "play"+index
        );

    const progress =
        document.getElementById(
            "progress"+index
        );

    const time =
        document.getElementById(
            "time"+index
        );

    const volume =
        document.getElementById(
            "volume"+index
        );


    players.push({
        audio:audio,
        button:button
    });


    /* PLAY / PAUSE */

    button.onclick = ()=>{

        players.forEach((p,i)=>{

            if(i !== index){

                p.audio.pause();

                p.button.textContent = "▶";

            }

        });


        if(audio.paused){

            audio.play().catch(()=>{});

            button.textContent = "❚❚";

        }else{

            audio.pause();

            button.textContent = "▶";

        }

    };


    /* DURAÇÃO */

    audio.addEventListener(
        "loadedmetadata",
        ()=>{

            time.textContent =
                "00:00 / " +
                formatTime(audio.duration);

        }
    );


    /* PROGRESSO */

    audio.addEventListener(
        "timeupdate",
        ()=>{

            if(audio.duration){

                progress.value =
                    (audio.currentTime /
                    audio.duration) * 100;

            }

            time.textContent =
                formatTime(audio.currentTime)
                +
                " / "
                +
                formatTime(audio.duration);

        }
    );


    /* CLICAR NA BARRA */

    progress.oninput = ()=>{

        if(audio.duration){

            audio.currentTime =
                (progress.value / 100)
                *
                audio.duration;

        }

    };


    /* VOLUME */

    volume.oninput = ()=>{

        audio.volume =
            volume.value;

    };


    /* FINAL */

    audio.addEventListener(
        "ended",
        ()=>{

            button.textContent = "▶";

            progress.value = 0;

        }
    );

});


/* =========================================================
   FORMATAÇÃO DO TEMPO
========================================================= */

function formatTime(seconds){

    if(!isFinite(seconds)){

        return "00:00";

    }

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return String(minutes)
        .padStart(2,"0")
        +
        ":"
        +
        String(secs)
        .padStart(2,"0");
}

</script>

</body>
</html>
